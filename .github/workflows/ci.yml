name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: Settings / theme / IPC consistency
        run: python3 tests/lint-settings.py
      - name: Theme pack tests
        run: python3 tests/test-theme-pack.py
      - name: shellcheck
        run: shellcheck -S warning install.sh nixos/install-nixos.sh scripts/*.sh tests/*.sh tests/vm/*.sh config/quickshell/scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile config/quickshell/scripts/*.py tests/*.py scripts/palettedesk
      - name: Lua syntax
        run: luac5.4 -p config/hypr/hyprland.lua

  arch-install:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Base tools
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm sudo git
      - uses: actions/checkout@v4
      - name: Install as a normal user
        run: |
          useradd -m tester && echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          cp -r "$GITHUB_WORKSPACE" /home/tester/palettedesk-shell && chown -R tester /home/tester/palettedesk-shell
          su - tester -c 'cd palettedesk-shell && ./install.sh --yes'
      - name: Second run changes nothing
        run: |
          su - tester -c 'cd palettedesk-shell && ./install.sh --yes' | tee /tmp/second.log
          ! grep -E 'installing /home|backing up' /tmp/second.log
      - name: palettedesk works and uninstall leaves nothing behind
        run: |
          su - tester -c 'PATH=$HOME/.local/bin:$PATH palettedesk version && palettedesk doctor || true'
          su - tester -c 'PATH=$HOME/.local/bin:$PATH palettedesk uninstall --purge --yes'
          ! su - tester -c 'test -e ~/.config/quickshell -o -e ~/.config/rice -o -e ~/.config/hypr/hyprland.lua'

  nixos-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: The module and test VM evaluate
        run: |
          nix --extra-experimental-features 'nix-command flakes' eval --impure --raw --expr \
            '(import "${builtins.getFlake "github:NixOS/nixpkgs/nixpkgs-unstable"}/nixos" { configuration = ./nixos/test/vm.nix; }).vm.drvPath'
